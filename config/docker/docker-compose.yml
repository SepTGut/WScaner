services:
  wscaner:
    build: .
    container_name: wscaner-bot
    restart: unless-stopped
    volumes:
      # Preserves WhatsApp login so you don't need to re-scan QR on container restarts
      - ./runtime/auth:/app/runtime/auth
      - ./runtime/temp:/app/runtime/temp
      - ./runtime/logs:/app/runtime/logs
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./.env:/app/.env
    stdin_open: true
    tty: true
